[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nullify"
version = "0.1.0"
description = "Agentic AI-powered malware & malware-type detection system (capstone project)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nate" }]
requires-python = ">=3.11"
keywords = ["malware", "detection", "agents", "security", "capstone", "mitre-attack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
logs = ["python-evtx>=0.7.4"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
static = ["pefile>=2023.2.7", "yara-python>=4.5", "flare-capa>=7.0.0"]
ml = ["xgboost>=2.0", "scikit-learn>=1.5", "pandas>=2.2", "numpy>=1.26"]
llm = ["anthropic>=0.34"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
nullify = "nullify.interfaces.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nullify"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# typer.Argument()/typer.Option() in defaults is the framework's standard idiom.
"src/nullify/interfaces/cli/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
